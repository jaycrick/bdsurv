# Install both hook types once after cloning: uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-push, manual]

repos:
  # Built-in hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: debug-statements

  # Ruff linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests|scripts)/
      - id: ruff-format
        files: ^(src|tests|scripts)/

  # basedpyright type checking (strict mode; local hook uses venv install)
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        language: system
        entry: uv run basedpyright --project pyproject.toml src/
        pass_filenames: false
        types: [python]
        files: ^src/

  # toml-sort
  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort
        args: [--no-sort-tables, --sort-inline-arrays, --sort-inline-tables]
        files: '\.toml$'

  # git3moji commit messages (https://robinpokorny.github.io/git3moji/)
  - repo: local
    hooks:
      - id: git3moji
        name: git3moji commit message
        language: script
        entry: .githooks/commit-msg
        stages: [commit-msg]
