[project]
name = "bdsurv"
version = "0.2.0"
description = "Simulation of birth-death processes, focused on survival-conditioned subcritical processes: exact contour-process reconstruction, multilevel (RESTART) splitting, and forward simulators for time-varying rates."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jacob Cumming" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "jax>=0.4.38",
  "numpy>=1.26",
  "pandas>=2.0"
]

[project.urls]
Homepage = "https://github.com/jaycrick/bdsurv"
Repository = "https://github.com/jaycrick/bdsurv"

[dependency-groups]
dev = [
  "basedpyright>=1.22.0",
  "pandas-stubs",
  "pre-commit>=4.5.1",
  "pytest-cov>=7.0.0",
  "pytest>=9.0.2",
  "scipy>=1.11",
  "ruff>=0.15.1",
  "toml-sort>=0.24.3"
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
# numpy's overloaded stubs for isclose/where/choice/etc. resolve to a partially
# unknown return type in strict mode; this is a stub-complexity artifact, not
# a real type-safety gap in this package's code.
reportUnknownMemberType = "none"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "D101", # test classes are self-documenting via their names
  "D102", # test methods are self-documenting via their names
  "E501", # test strings and fixture data are allowed to be long
  "S101" # asserts are the mechanism of the tests
]

[tool.toml-sort]
all = true
ignore_case = true
in_place = true
no_sort_tables = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true

[tool.pytest.ini_options]
markers = ["slow: long-running statistical tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=86"
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
precision = 2

[tool.setuptools.packages.find]
where = ["src"]
include = ["bdsurv*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
