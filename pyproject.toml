[project]
name = "bdsurv"
version = "0.4.0"
description = "Simulation of birth-death processes, focused on survival-conditioned subcritical processes: exact contour-process reconstruction, multilevel (RESTART) splitting, and forward simulators for time-varying rates."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jacob Cumming" }]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "jax>=0.4.38",
  "numpy>=1.26",
  "pandas>=2.0"
]

[project.urls]
Homepage = "https://github.com/jaycrick/bdsurv"
Repository = "https://github.com/jaycrick/bdsurv"

[dependency-groups]
bench = [
  "altair>=6.0.0",
  "jupyter-cache>=1.0.1",
  "jupyter>=1.1.1",
  "pyyaml>=6.0",
  "quarto>=0.1.0",
  "vl-convert-python>=1.9.0.post1"
]
dev = [
  "basedpyright>=1.22.0",
  "hypothesis>=6.170.15",
  "pandas-stubs",
  "pre-commit>=4.5.1",
  "pytest-cov>=7.0.0",
  "pytest>=9.0.2",
  "scipy>=1.11",
  "ruff>=0.15.1",
  "toml-sort>=0.24.3"
]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
# numpy's overloaded stubs for isclose/where/choice/etc. resolve to a partially
# unknown return type in strict mode; this is a stub-complexity artifact, not
# a real type-safety gap in this package's code.
reportUnknownMemberType = "none"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "ARG",
  "B",
  "BLE",
  "C90",
  "D",
  "E",
  "ERA",
  "F",
  "I",
  "N",
  "NPY",
  "PERF",
  "PLR",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "SLF",
  "UP",
  "W"
]
ignore = [
  "N803", # mathematical argument names such as E and T
  "N806", # mathematical variable names such as E and T
  "PLR2004" # numeric literals are normal in maths and tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
  "E402" # thread-pool and JAX environment variables are set before importing
]
"tests/*" = [
  "D101", # test classes are self-documenting via their names
  "D102", # test methods are self-documenting via their names
  "E501", # test strings and fixture data are allowed to be long
  "PLR0913", # test helpers take many parameters
  "S101", # asserts are the mechanism of the tests
  "SLF001" # tests exercise private kernels directly
]

# TEMPORARY: removed by step S9
"src/bdsurv/__init__.py" = ["RUF022"]
# TEMPORARY: removed by step S11
"scripts/arley_charts.py" = ["PLR0913"]
"scripts/bench_arley_comparison.py" = ["PERF401", "SLF001"]
"scripts/bench_method_comparison.py" = ["PERF401"]
"scripts/count_draws.py" = ["RUF028", "SLF001"]
"scripts/figure_export.py" = ["SIM105"]
"scripts/method_comparison_charts.py" = ["PLR0913"]
"tests/test_arley_grid.py" = ["PERF401"]

[tool.toml-sort]
all = true
ignore_case = true
in_place = true
no_sort_tables = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true

[tool.pytest.ini_options]
markers = ["slow: long-running statistical tests"]
addopts = "-m 'not slow' --strict-markers"
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["tests", "scripts"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
precision = 2

[tool.setuptools.packages.find]
where = ["src"]
include = ["bdsurv*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
